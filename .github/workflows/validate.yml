name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: Validate plugin structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate manifests, frontmatter, and links
        run: python scripts/validate_skillframe.py

      - name: Check whitespace errors
        run: git diff --check

  secrets:
    name: Scan for secrets with TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v3.95.3 release commit. The container tag is 3.95.3 (without the v prefix).
      - name: Scan changed commits
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab
        with:
          version: 3.95.3
          extra_args: --results=verified,unknown
